<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vehicle Design Dashboard</title>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --accent: #58a6ff;
  --danger: #f85149;
  --warning: #d29922;
  --success: #3fb950;
}

body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── TOP BAR ─────────────────────────────────────────── */
#topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  height: 56px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
#project-title { font-size: 1.1rem; font-weight: 700; }
#project-subtitle { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }

.tabs { display: flex; gap: 4px; }
.tab-btn {
  padding: 7px 18px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--muted);
  cursor: pointer;
  font-size: 0.875rem;
  transition: all 0.15s;
}
.tab-btn.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 700; }
.tab-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

.btn-secondary {
  padding: 7px 16px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.82rem;
  transition: all 0.15s;
  white-space: nowrap;
}
.btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

/* ── MAIN ────────────────────────────────────────────── */
#main { flex: 1; overflow: hidden; position: relative; display: flex; flex-direction: column; }

/* ── DROP ZONE ───────────────────────────────────────── */
#dropzone {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  transition: background 0.2s;
}
#dropzone.drag-over { background: rgba(88,166,255,0.06); }

.drop-box {
  border: 2px dashed var(--border);
  border-radius: 16px;
  padding: 56px 80px;
  text-align: center;
  transition: border-color 0.2s;
}
#dropzone.drag-over .drop-box { border-color: var(--accent); }
.drop-icon { font-size: 3rem; margin-bottom: 14px; }
.drop-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; }
.drop-sub { color: var(--muted); font-size: 0.88rem; margin-bottom: 20px; }
.btn-primary {
  padding: 10px 24px;
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.9rem;
  font-weight: 700;
}
.btn-primary:hover { opacity: 0.85; }

/* ── DASHBOARD ───────────────────────────────────────── */
#dashboard { display: none; flex: 1; flex-direction: column; overflow: hidden; }

.tab-panel { display: none; flex: 1; overflow: hidden; flex-direction: column; }
.tab-panel.active { display: flex; }

/* ── GANTT ───────────────────────────────────────────── */
#gantt-container { display: flex; flex: 1; overflow: hidden; }

#gantt-left {
  width: 380px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  border-right: 2px solid var(--border);
  overflow: hidden;
}
#gantt-left-header {
  display: grid;
  grid-template-columns: 52px 1fr 76px 52px;
  padding: 0 10px;
  height: 60px;
  align-items: flex-end;
  padding-bottom: 10px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
#gantt-left-body { overflow-y: auto; overflow-x: hidden; flex: 1; }
#gantt-left-body::-webkit-scrollbar { width: 4px; }
#gantt-left-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.gantt-row {
  display: grid;
  grid-template-columns: 52px 1fr 76px 52px;
  padding: 0 10px;
  height: 36px;
  align-items: center;
  border-bottom: 1px solid rgba(48,54,61,0.5);
  font-size: 0.8rem;
  user-select: none;
}
.gantt-row:hover { background: rgba(88,166,255,0.04); }
.g-wbs { font-size: 0.7rem; font-family: monospace; }
.g-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 6px; }
.g-team { color: var(--muted); font-size: 0.72rem; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-pct { text-align: right; font-size: 0.75rem; font-weight: 700; }

/* Right scrollable area */
#gantt-right { flex: 1; overflow: auto; }
#gantt-right::-webkit-scrollbar { height: 6px; width: 4px; }
#gantt-right::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ── SPECS ───────────────────────────────────────────── */
#specs-toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
#specs-toolbar select {
  padding: 6px 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 6px;
  font-size: 0.85rem;
  cursor: pointer;
}
#specs-body { flex: 1; overflow: auto; }
#specs-body::-webkit-scrollbar { width: 6px; height: 6px; }
#specs-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.specs-table { width: 100%; border-collapse: collapse; font-size: 0.84rem; min-width: 920px; }
.specs-table th {
  background: var(--surface);
  padding: 9px 12px;
  text-align: left;
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 2;
}
.specs-table td { padding: 7px 12px; border-bottom: 1px solid rgba(48,54,61,0.45); vertical-align: middle; }
.spec-row:hover td { background: rgba(88,166,255,0.05); cursor: pointer; }
.cat-header td {
  padding: 5px 12px;
  font-weight: 700;
  font-size: 0.75rem;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}

.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 0.73rem;
  font-weight: 700;
}
.badge-achieved { background: rgba(63,185,80,0.2); color: #3fb950; }
.badge-target   { background: rgba(88,166,255,0.2); color: #58a6ff; }
.badge-tbd      { background: rgba(210,153,34,0.2); color: #d29922; }

/* ── SIDE PANEL ──────────────────────────────────────── */
#side-panel {
  position: fixed;
  top: 56px; right: -440px; bottom: 0;
  width: 420px;
  background: var(--surface);
  border-left: 1px solid var(--border);
  z-index: 200;
  transition: right 0.28s cubic-bezier(.4,0,.2,1);
  display: flex;
  flex-direction: column;
  box-shadow: -8px 0 32px rgba(0,0,0,0.4);
}
#side-panel.open { right: 0; }

#sp-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 16px 16px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
#sp-title { font-size: 0.95rem; font-weight: 700; flex: 1; margin-right: 10px; line-height: 1.3; }
#sp-close {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 1.1rem;
  line-height: 1;
  padding: 2px 4px;
  border-radius: 4px;
  flex-shrink: 0;
}
#sp-close:hover { background: rgba(255,255,255,0.08); color: var(--text); }

#sp-body { flex: 1; overflow-y: auto; padding: 16px; }
#sp-body::-webkit-scrollbar { width: 4px; }
#sp-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.sp-meta {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  margin-bottom: 16px;
}
.sp-meta-id { font-size: 0.72rem; color: var(--muted); margin-bottom: 4px; }
.sp-meta-val { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; }
.sp-meta-notes { margin-top: 10px; font-size: 0.8rem; color: var(--muted); line-height: 1.5; }

.risk-alert {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(248,81,73,0.12);
  border: 1px solid rgba(248,81,73,0.35);
  color: var(--danger);
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 0.8rem;
  font-weight: 700;
  margin-bottom: 14px;
}

.sp-section-label {
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 0.07em;
  text-transform: uppercase;
  margin-bottom: 10px;
}

.task-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-left: 3px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  margin-bottom: 8px;
}
.task-card.risk  { border-left-color: var(--danger); }
.task-card.warn  { border-left-color: var(--warning); }
.task-card.done  { border-left-color: var(--success); }
.task-card.future{ border-left-color: var(--border); }

.tc-id   { font-size: 0.7rem; color: var(--muted); margin-bottom: 2px; }
.tc-name { font-weight: 700; font-size: 0.88rem; margin-bottom: 5px; }
.tc-meta { font-size: 0.75rem; color: var(--muted); }
.tc-risk { font-size: 0.73rem; color: var(--danger); margin-top: 4px; font-weight: 600; }

.no-deps { text-align: center; color: var(--muted); font-size: 0.9rem; padding: 32px 0; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <div>
    <div id="project-title">Vehicle Design Dashboard</div>
    <div id="project-subtitle">Drop an Excel file to load your project</div>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <div class="tabs" id="tabs" style="display:none">
      <button class="tab-btn active" data-tab="gantt" onclick="switchTab(this,'gantt')">Gantt Chart</button>
      <button class="tab-btn"        data-tab="specs" onclick="switchTab(this,'specs')">Vehicle Specifications</button>
    </div>
    <button class="btn-secondary" onclick="generateSampleExcel()" title="Download a pre-filled sample Excel to get started">Generate Sample Excel</button>
  </div>
</div>

<!-- MAIN -->
<div id="main">

  <!-- DROP ZONE -->
  <div id="dropzone">
    <div class="drop-box" id="drop-box">
      <div class="drop-icon">📊</div>
      <div class="drop-title">Drop your Excel file here</div>
      <div class="drop-sub">
        Accepts any .xlsx file with <strong>Project Info</strong>, <strong>Schedule</strong>, and <strong>Specifications</strong> sheets<br>
        — or click below to generate a sample file first —
      </div>
      <button class="btn-primary" onclick="document.getElementById('file-input').click()">Browse for File</button>
    </div>
    <input type="file" id="file-input" accept=".xlsx,.xls" style="display:none">
  </div>

  <!-- DASHBOARD (shown after load) -->
  <div id="dashboard">

    <!-- GANTT TAB -->
    <div class="tab-panel active" id="gantt-panel">
      <div id="gantt-container">
        <div id="gantt-left">
          <div id="gantt-left-header">
            <span>WBS</span><span>Task Name</span>
            <span style="text-align:right">Team</span>
            <span style="text-align:right">%</span>
          </div>
          <div id="gantt-left-body"></div>
        </div>
        <div id="gantt-right">
          <div id="gantt-svg-wrap"></div>
        </div>
      </div>
    </div>

    <!-- SPECS TAB -->
    <div class="tab-panel" id="specs-panel">
      <div id="specs-toolbar">
        <span style="font-size:0.78rem;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase">Filter:</span>
        <select id="specs-filter" onchange="renderSpecTable()">
          <option value="all">All Categories</option>
        </select>
        <span id="specs-count" style="font-size:0.8rem;color:var(--muted);margin-left:4px"></span>
      </div>
      <div id="specs-body">
        <div id="specs-table-wrap"></div>
      </div>
    </div>

  </div><!-- /dashboard -->
</div><!-- /main -->

<!-- SIDE PANEL -->
<div id="side-panel">
  <div id="sp-header">
    <div id="sp-title">Task Dependencies</div>
    <button id="sp-close" onclick="closeSidePanel()">✕</button>
  </div>
  <div id="sp-body"></div>
</div>

<script>
// ─── App State ────────────────────────────────────────────────────────────────
const S = { info: {}, tasks: [], specs: [] };
const TODAY = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();

// ─── Category Colors ──────────────────────────────────────────────────────────
const GANTT_COLORS = {
  Concept:     '#7c3aed',
  Engineering: '#1d6fe8',
  Prototype:   '#0891b2',
  Validation:  '#d97706',
  Launch:      '#dc2626',
};
const SPEC_COLORS = {
  Powertrain:  { bg: 'rgba(239,68,68,.12)',   text: '#ef4444' },
  Chassis:     { bg: 'rgba(29,111,232,.12)',  text: '#60a5fa' },
  Electrical:  { bg: 'rgba(251,191,36,.12)',  text: '#fbbf24' },
  Body:        { bg: 'rgba(52,211,153,.12)',  text: '#34d399' },
  Safety:      { bg: 'rgba(248,113,113,.12)', text: '#f87171' },
  Software:    { bg: 'rgba(167,139,250,.12)', text: '#a78bfa' },
};

// ─── Tab Switching ────────────────────────────────────────────────────────────
function switchTab(btn, id) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(id + '-panel').classList.add('active');
  if (id !== 'specs') closeSidePanel();
}

// ─── Drag & Drop ──────────────────────────────────────────────────────────────
const dz = document.getElementById('dropzone');
document.addEventListener('dragover',  e => { e.preventDefault(); dz.classList.add('drag-over'); });
document.addEventListener('dragleave', e => { if (!e.relatedTarget) dz.classList.remove('drag-over'); });
document.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('drag-over');
  const f = e.dataTransfer.files[0];
  if (f) loadFile(f);
});
document.getElementById('file-input').addEventListener('change', e => {
  if (e.target.files[0]) loadFile(e.target.files[0]);
});

function loadFile(file) {
  const r = new FileReader();
  r.onload = ev => {
    try {
      const wb = XLSX.read(ev.target.result, { type: 'array', cellDates: true });
      parseWorkbook(wb);
      renderDashboard();
    } catch(e) { alert('Could not parse file:\n' + e.message); }
  };
  r.readAsArrayBuffer(file);
}

// ─── Parse Workbook ───────────────────────────────────────────────────────────
function parseWorkbook(wb) {
  S.info = {}; S.tasks = []; S.specs = [];

  // Project Info
  const ws1 = wb.Sheets['Project Info'];
  if (ws1) {
    XLSX.utils.sheet_to_json(ws1, { header:1 })
      .forEach(r => { if (r[0] && r[1] != null) S.info[String(r[0]).trim()] = r[1]; });
  }

  // Schedule
  const ws2 = wb.Sheets['Schedule'];
  if (ws2) {
    const rows = XLSX.utils.sheet_to_json(ws2, { header:1 });
    const h = rows[0] || [];
    S.tasks = rows.slice(1).filter(r => r[h.indexOf('Task ID')] != null).map(r => {
      const g = k => r[h.indexOf(k)];
      return {
        id:        +g('Task ID'),
        wbs:       String(g('WBS') || ''),
        name:      String(g('Task Name') || ''),
        category:  String(g('Category') || ''),
        start:     parseDate(g('Start Date')),
        end:       parseDate(g('End Date')),
        pct:       +g('% Complete') || 0,
        deps:      parseDeps(g('Dependencies')),
        team:      String(g('Responsible Team') || ''),
        milestone: String(g('Milestone') || '').toUpperCase() === 'Y',
        notes:     String(g('Notes') || ''),
      };
    });
  }

  // Specifications
  const ws3 = wb.Sheets['Specifications'];
  if (ws3) {
    const rows = XLSX.utils.sheet_to_json(ws3, { header:1 });
    const h = rows[0] || [];
    S.specs = rows.slice(1).filter(r => r[h.indexOf('Spec ID')] != null).map(r => {
      const g = k => r[h.indexOf(k)];
      return {
        id:       String(g('Spec ID') || ''),
        category: String(g('Category') || ''),
        name:     String(g('Specification Name') || ''),
        value:    g('Value') != null ? g('Value') : '',
        units:    String(g('Units') || '—'),
        status:   String(g('Status') || 'TBD'),
        group:    String(g('Responsible Group') || ''),
        notes:    String(g('Notes') || ''),
        depIds:   parseDeps(g('Dependent Task IDs')),
      };
    });
  }
}

function parseDate(v) {
  if (!v) return null;
  if (v instanceof Date) { const d = new Date(v); d.setHours(0,0,0,0); return d; }
  const d = new Date(v);
  if (!isNaN(d)) { d.setHours(0,0,0,0); return d; }
  return null;
}
function parseDeps(v) {
  if (!v) return [];
  return String(v).split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));
}
function fmt(d) { return d ? d.toISOString().slice(0,10) : '—'; }

// ─── Render Dashboard ─────────────────────────────────────────────────────────
function renderDashboard() {
  const title = S.info['Project Title'] || 'Vehicle Design Dashboard';
  const sub = [S.info['Vehicle Program'], S.info['Project Manager']].filter(Boolean).join(' · ');
  document.getElementById('project-title').textContent = title;
  document.getElementById('project-subtitle').textContent = sub || 'Project Dashboard';
  document.getElementById('dropzone').style.display = 'none';
  document.getElementById('dashboard').style.display = 'flex';
  document.getElementById('tabs').style.display = 'flex';
  renderGantt();
  renderSpecs();
}

// ─── GANTT ────────────────────────────────────────────────────────────────────
const PX = 4;   // pixels per day
const RH = 36;  // row height
const HH = 60;  // header height

function daysBetween(a, b) { return Math.round((b - a) / 86400000); }

function renderGantt() {
  if (!S.tasks.length) return;
  const dates = S.tasks.flatMap(t => [t.start, t.end]).filter(Boolean);
  const minD = new Date(Math.min(...dates)); minD.setDate(minD.getDate() - 7);
  const maxD = new Date(Math.max(...dates)); maxD.setDate(maxD.getDate() + 21);
  const totalDays = daysBetween(minD, maxD);
  const W = totalDays * PX;
  const H = HH + S.tasks.length * RH;
  const NS = 'http://www.w3.org/2000/svg';

  // ── Left panel rows ────────────────────────────────
  const lb = document.getElementById('gantt-left-body');
  lb.innerHTML = '';
  S.tasks.forEach(t => {
    const color = GANTT_COLORS[t.category] || '#58a6ff';
    const pctColor = t.pct === 100 ? '#3fb950' : t.pct > 0 ? '#d29922' : '#484f58';
    const depth = (t.wbs.match(/\./g) || []).length;
    const div = document.createElement('div');
    div.className = 'gantt-row';
    div.innerHTML = `
      <span class="g-wbs" style="color:${color}">${t.wbs}</span>
      <span class="g-name" style="padding-left:${depth*10}px" title="${t.name}">${t.milestone ? '◆ ' : ''}${t.name}</span>
      <span class="g-team" title="${t.team}">${t.team}</span>
      <span class="g-pct" style="color:${pctColor}">${t.pct}%</span>`;
    lb.appendChild(div);
  });

  // ── Build SVG ──────────────────────────────────────
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  svg.style.display = 'block';

  // Defs (arrowhead)
  const defs = document.createElementNS(NS, 'defs');
  const mk = document.createElementNS(NS, 'marker');
  mk.setAttribute('id', 'arr'); mk.setAttribute('markerWidth', '7');
  mk.setAttribute('markerHeight', '7'); mk.setAttribute('refX', '7');
  mk.setAttribute('refY', '3.5'); mk.setAttribute('orient', 'auto');
  const poly = document.createElementNS(NS, 'polygon');
  poly.setAttribute('points', '0 0, 7 3.5, 0 7');
  poly.setAttribute('fill', 'rgba(139,148,158,0.5)');
  mk.appendChild(poly); defs.appendChild(mk); svg.appendChild(defs);

  // Header background
  appendRect(svg, NS, 0, 0, W, HH, '#161b22');

  // Alternating row stripes
  S.tasks.forEach((_, i) => {
    if (i % 2 === 0) appendRect(svg, NS, 0, HH + i*RH, W, RH, 'rgba(255,255,255,0.015)');
  });

  // Month / week header
  renderHeader(svg, NS, minD, maxD, W);

  // Row dividers
  for (let i = 0; i <= S.tasks.length; i++) {
    appendLine(svg, NS, 0, W, HH + i*RH, HH + i*RH, 'rgba(48,54,61,0.5)', 1);
  }

  // Bar positions for arrows
  const barPos = {};

  // Bars
  S.tasks.forEach((t, i) => {
    if (!t.start || !t.end) return;
    const x  = daysBetween(minD, t.start) * PX;
    const w  = Math.max(daysBetween(t.start, t.end) * PX, PX);
    const midY = HH + i*RH + RH/2;
    const color = GANTT_COLORS[t.category] || '#58a6ff';

    if (t.milestone) {
      const mx = x + w, sz = 7;
      const pts = `${mx},${midY-sz} ${mx+sz},${midY} ${mx},${midY+sz} ${mx-sz},${midY}`;
      const d = document.createElementNS(NS, 'polygon');
      d.setAttribute('points', pts); d.setAttribute('fill', color);
      svg.appendChild(d);
      barPos[t.id] = { sx: mx - sz, ex: mx + sz, my: midY };
    } else {
      const by = HH + i*RH + RH*0.28, bh = RH*0.44;
      // track
      appendRect(svg, NS, x, by, w, bh, color + '30', 4);
      // fill
      if (t.pct > 0) appendRect(svg, NS, x, by, w*(t.pct/100), bh, color, 4);
      else {
        const r = document.createElementNS(NS, 'rect');
        r.setAttribute('x', x); r.setAttribute('y', by);
        r.setAttribute('width', w); r.setAttribute('height', bh);
        r.setAttribute('rx', 4); r.setAttribute('fill', 'none');
        r.setAttribute('stroke', color); r.setAttribute('stroke-width', 1.5);
        svg.appendChild(r);
      }
      barPos[t.id] = { sx: x, ex: x + w, my: midY };
    }
  });

  // Dependency arrows
  S.tasks.forEach(t => {
    t.deps.forEach(did => {
      const pred = barPos[did], succ = barPos[t.id];
      if (!pred || !succ) return;
      const x1 = pred.ex, y1 = pred.my, x2 = succ.sx, y2 = succ.my;
      const ox = Math.max(x1 + 8, x2 - 8);
      const pathD = `M ${x1} ${y1} L ${ox} ${y1} L ${ox} ${y2} L ${x2} ${y2}`;
      const p = document.createElementNS(NS, 'path');
      p.setAttribute('d', pathD); p.setAttribute('fill', 'none');
      p.setAttribute('stroke', 'rgba(139,148,158,0.35)'); p.setAttribute('stroke-width', 1.5);
      p.setAttribute('marker-end', 'url(#arr)');
      svg.appendChild(p);
    });
  });

  // Today line
  const tx = daysBetween(minD, TODAY) * PX;
  if (tx > 0 && tx < W) {
    appendLine(svg, NS, tx, tx, 0, H, '#f85149', 1.5, '4,3');
    const tl = document.createElementNS(NS, 'text');
    tl.setAttribute('x', tx+4); tl.setAttribute('y', 13);
    tl.setAttribute('fill', '#f85149'); tl.setAttribute('font-size', '10');
    tl.setAttribute('font-weight', '700'); tl.textContent = 'Today';
    svg.appendChild(tl);
  }

  document.getElementById('gantt-svg-wrap').innerHTML = '';
  document.getElementById('gantt-svg-wrap').appendChild(svg);

  // Sync vertical scroll
  const right = document.getElementById('gantt-right');
  right.addEventListener('scroll', () => { lb.scrollTop = right.scrollTop; }, { passive:true });
  lb.addEventListener('scroll', () => { right.scrollTop = lb.scrollTop; }, { passive:true });
}

function renderHeader(svg, NS, minD, maxD, W) {
  // Header bottom border
  appendLine(svg, NS, 0, W, HH, HH, '#30363d', 1);

  const cur = new Date(minD.getFullYear(), minD.getMonth(), 1);
  while (cur <= maxD) {
    const x = daysBetween(minD, cur) * PX;

    // Month divider
    appendLine(svg, NS, x, x, 0, HH + 9999, 'rgba(48,54,61,0.6)', 1);

    // Month label
    const ml = document.createElementNS(NS, 'text');
    ml.setAttribute('x', x+5); ml.setAttribute('y', 30);
    ml.setAttribute('fill', '#8b949e'); ml.setAttribute('font-size', '11');
    ml.setAttribute('font-weight', '700');
    ml.textContent = cur.toLocaleString('default', { month: 'short' }) + ' ' + cur.getFullYear();
    svg.appendChild(ml);

    // Week ticks
    const nxt = new Date(cur); nxt.setMonth(nxt.getMonth()+1);
    const wk = new Date(cur); wk.setDate(wk.getDate() + (7 - wk.getDay()));
    while (wk < nxt && wk <= maxD) {
      const wx = daysBetween(minD, wk) * PX;
      appendLine(svg, NS, wx, wx, 42, HH, 'rgba(48,54,61,0.4)', 1);
      const dl = document.createElementNS(NS, 'text');
      dl.setAttribute('x', wx+2); dl.setAttribute('y', 54);
      dl.setAttribute('fill', '#484f58'); dl.setAttribute('font-size', '9');
      dl.textContent = wk.getDate();
      svg.appendChild(dl);
      wk.setDate(wk.getDate()+7);
    }
    cur.setMonth(cur.getMonth()+1);
  }
}

// SVG helpers
function appendRect(svg, NS, x, y, w, h, fill, rx=0) {
  const r = document.createElementNS(NS, 'rect');
  r.setAttribute('x',x); r.setAttribute('y',y);
  r.setAttribute('width',w); r.setAttribute('height',h);
  r.setAttribute('fill',fill); if (rx) r.setAttribute('rx',rx);
  svg.appendChild(r); return r;
}
function appendLine(svg, NS, x1, x2, y1, y2, stroke, sw, dash='') {
  const l = document.createElementNS(NS, 'line');
  l.setAttribute('x1',x1); l.setAttribute('x2',x2);
  l.setAttribute('y1',y1); l.setAttribute('y2',y2);
  l.setAttribute('stroke',stroke); l.setAttribute('stroke-width',sw);
  if (dash) l.setAttribute('stroke-dasharray',dash);
  svg.appendChild(l); return l;
}

// ─── SPECS ────────────────────────────────────────────────────────────────────
function renderSpecs() {
  const sel = document.getElementById('specs-filter');
  sel.innerHTML = '<option value="all">All Categories</option>';
  [...new Set(S.specs.map(s => s.category))].forEach(c => {
    const o = document.createElement('option'); o.value = c; o.textContent = c;
    sel.appendChild(o);
  });
  renderSpecTable();
}

function renderSpecTable() {
  const cat = document.getElementById('specs-filter').value;
  const list = cat === 'all' ? S.specs : S.specs.filter(s => s.category === cat);

  const groups = {};
  list.forEach(s => { (groups[s.category] = groups[s.category]||[]).push(s); });

  const count = list.length;
  document.getElementById('specs-count').textContent = `${count} specification${count!==1?'s':''}`;

  let html = `<table class="specs-table"><thead><tr>
    <th>Spec ID</th><th>Specification</th><th>Value</th><th>Units</th>
    <th>Status</th><th>Responsible Group</th><th>Notes</th><th style="text-align:center">Dep. Tasks</th>
  </tr></thead><tbody>`;

  Object.entries(groups).forEach(([c, specs]) => {
    const col = SPEC_COLORS[c] || { bg:'rgba(88,166,255,.1)', text:'#58a6ff' };
    html += `<tr class="cat-header"><td colspan="8" style="background:${col.bg};color:${col.text}">${c}</td></tr>`;
    specs.forEach(s => {
      const sc = s.status==='Achieved' ? 'badge-achieved' : s.status==='Target' ? 'badge-target' : 'badge-tbd';
      const hasRisk = s.status === 'TBD' && s.depIds.some(id => {
        const t = S.tasks.find(t => t.id === id);
        return t && t.start && t.start <= TODAY;
      });
      const depText = s.depIds.length
        ? `<span style="color:${hasRisk?'var(--danger)':'var(--muted)'};font-weight:${hasRisk?700:400}">${s.depIds.length}${hasRisk?' ⚠':''}</span>`
        : `<span style="color:#484f58">—</span>`;
      const safeId = s.id.replace(/"/g, '&quot;');
      html += `<tr class="spec-row" onclick="openSidePanel('${safeId}')">
        <td><code style="color:${col.text};font-size:0.78rem">${s.id}</code></td>
        <td><strong>${s.name}</strong></td>
        <td>${s.value}</td>
        <td style="color:var(--muted)">${s.units}</td>
        <td><span class="badge ${sc}">${s.status}</span></td>
        <td style="color:var(--muted);font-size:0.8rem">${s.group}</td>
        <td style="color:var(--muted);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:0.8rem" title="${s.notes}">${s.notes||'—'}</td>
        <td style="text-align:center">${depText}</td>
      </tr>`;
    });
  });

  html += '</tbody></table>';
  document.getElementById('specs-table-wrap').innerHTML = html;
}

// ─── SIDE PANEL ───────────────────────────────────────────────────────────────
function openSidePanel(specId) {
  const s = S.specs.find(s => s.id === specId);
  if (!s) return;

  const col = SPEC_COLORS[s.category] || { text:'#58a6ff' };
  document.getElementById('sp-title').textContent = s.name;

  const sc = s.status==='Achieved' ? 'badge-achieved' : s.status==='Target' ? 'badge-target' : 'badge-tbd';
  let html = `<div class="sp-meta">
    <div class="sp-meta-id"><code style="color:${col.text}">${s.id}</code> · ${s.category} · ${s.group}</div>
    <div class="sp-meta-val">${s.value} <span style="font-size:0.85rem;font-weight:400;color:var(--muted)">${s.units}</span></div>
    <span class="badge ${sc}">${s.status}</span>
    ${s.notes ? `<div class="sp-meta-notes">${s.notes}</div>` : ''}
  </div>`;

  if (!s.depIds.length) {
    html += `<div class="no-deps">No task dependencies linked<br>to this specification.</div>`;
  } else {
    const hasRisk = s.status === 'TBD' && s.depIds.some(id => {
      const t = S.tasks.find(t => t.id === id);
      return t && t.start && t.start <= TODAY;
    });

    if (hasRisk) html += `<div class="risk-alert">⚠ BLOCKED RISK — Spec is TBD but dependent task(s) have started</div>`;

    html += `<div class="sp-section-label">Dependent Tasks (${s.depIds.length})</div>`;

    s.depIds.forEach(id => {
      const t = S.tasks.find(t => t.id === id);
      if (!t) { html += `<div class="task-card future"><div class="tc-id">Task ${id}</div><div class="tc-name" style="color:var(--muted)">Not found in Schedule</div></div>`; return; }

      const started = t.start && t.start <= TODAY;
      const done    = t.pct === 100;
      const cardCls = done ? 'done' : started && t.pct > 0 ? 'warn' : started ? 'risk' : 'future';
      const gc      = GANTT_COLORS[t.category] || '#58a6ff';
      const showRisk = started && !done && s.status === 'TBD';

      html += `<div class="task-card ${cardCls}">
        <div class="tc-id">Task ${t.id} · ${t.wbs} · <span style="color:${gc}">${t.category}</span></div>
        <div class="tc-name">${t.milestone ? '◆ ' : ''}${t.name}</div>
        <div class="tc-meta">${fmt(t.start)} → ${fmt(t.end)} · ${t.team} · ${t.pct}% complete</div>
        ${showRisk ? '<div class="tc-risk">⚠ Task active — spec not yet locked</div>' : ''}
      </div>`;
    });
  }

  document.getElementById('sp-body').innerHTML = html;
  document.getElementById('side-panel').classList.add('open');
}

function closeSidePanel() {
  document.getElementById('side-panel').classList.remove('open');
}
